    <style type="text/tailwindcss">
        :root {
            --primary-glow: #ffffff;
            --background-start: #000000;
            --background-end: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #e5e5e5;
            --input-bg: #2a2a2a;
            --icon-color: #ffffff;
            --news-bg: rgba(42, 42, 42, 0.8);
            --news-border: rgba(255, 255, 255, 0.2);
            --tab-active-bg: rgba(255, 255, 255, 0.1);
            --tab-active-border: var(--primary-glow);
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }
        .glowing-border {
            box-shadow: 0 0 5px var(--primary-glow), 0 0 10px var(--primary-glow), 0 0 15px var(--primary-glow);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 5px var(--primary-glow), 0 0 10px var(--primary-glow), 0 0 15px var(--primary-glow); }
            50% { box-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow), 0 0 30px var(--primary-glow); }
            100% { box-shadow: 0 0 5px var(--primary-glow), 0 0 10px var(--primary-glow), 0 0 15px var(--primary-glow); }
        }

        /* Animated background elements */
        .nebula-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: float 20s infinite ease-in-out;
            opacity: 0.3;
        }

        .blob1 {
            top: 10%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #333333, #666666);
            animation-delay: 0s;
        }

        .blob2 {
            top: 60%;
            right: 10%;
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #444444, #777777);
            animation-delay: -10s;
        }

        .blob3 {
            bottom: 20%;
            left: 30%;
            width: 250px;
            height: 250px;
            background: linear-gradient(45deg, #555555, #888888);
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            perspective: 1000px;
        }
        .particle {
            position: absolute;
            background-color: var(--primary-glow);
            border-radius: 50%;
            opacity: 0;
            animation: float-depth 40s infinite linear;
        }
        @keyframes float-depth {
            0% {
                transform: translateZ(0) translateY(0);
                opacity: 0.7;
            }
            100% {
                transform: translateZ(-1000px) translateY(-100vh);
                opacity: 0;
            }
        }
        .greeting-glow {
            animation: text-glow 3s ease-in-out infinite;
        }
        @keyframes text-glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.2), 0 0 20px rgba(255, 255, 255, 0.1), 0 0 30px rgba(255, 255, 255, 0.05);
            }
            50% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(255, 255, 255, 0.2), 0 0 60px rgba(255, 255, 255, 0.1);
            }
        }
        .news-ticker {
            animation: ticker-scroll 30s linear infinite;
        }
        @keyframes ticker-scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }
        [data-tab-content] {
            display: none;
        }
        .active[data-tab-content] {
            display: block;
        }
    </style>
</head>

    <script>
        // A simple script to set the greeting based on the time of day.
        const greetingElement = document.getElementById('greeting');
        const hour = new Date().getHours();
        if (hour < 12) {
            greetingElement.textContent = 'Good Morning, Guru';
        } else if (hour < 18) {
            greetingElement.textContent = 'Good Afternoon, Guru';
        } else {
            greetingElement.textContent = 'Good Evening, Guru';
        }
        // Tab functionality
        const tabs = document.querySelectorAll('[data-tab-target]');
        const tabContents = document.querySelectorAll('[data-tab-content]');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = document.querySelector(tab.dataset.tabTarget);
                const isSavedTab = tab.dataset.tabTarget === '#saved';
                const mainContent = document.querySelector('main');
                const footer = document.querySelector('footer');
                if (isSavedTab) {
                    mainContent.style.display = 'none';
                    footer.style.position = 'static';
                    document.body.style.overflow = 'auto';
                    const savedArticlesContainer = document.getElementById('saved');
                    savedArticlesContainer.style.height = 'calc(100vh - ' + footer.querySelector('.border-b').offsetHeight + 'px)';
                    savedArticlesContainer.classList.remove('max-h-32');
                    savedArticlesContainer.classList.add('h-full');
                } else {
                    mainContent.style.display = 'flex';
                    footer.style.position = 'fixed';
                    document.body.style.overflow = 'hidden';
                    const savedArticlesContainer = document.getElementById('saved');
                    savedArticlesContainer.classList.add('max-h-32');
                    savedArticlesContainer.classList.remove('h-full');
                }
                tabContents.forEach(tabContent => {
                    tabContent.classList.remove('active');
                })
                tabs.forEach(t => {
                    t.classList.remove('active');
                    t.classList.remove('text-[var(--text-primary)]');
                    t.classList.add('text-[var(--text-secondary)]');
                    t.style.borderColor = 'transparent';
                })
                tab.classList.add('active');
                tab.classList.remove('text-[var(--text-secondary)]');
                tab.classList.add('text-[var(--text-primary)]');
                tab.style.borderColor = 'var(--tab-active-border)';
                target.classList.add('active');
            })
        });
        // Set initial active tab border
        const activeTab = document.querySelector('[data-tab-target].active');
        if (activeTab) {
            activeTab.style.borderColor = 'var(--tab-active-border)';
        }
        const apiKey = "pub_a4dafebff4ae43c69d38ecdd1f87f71c"; // Replace with your real API key

        function createNewsItem(article) {
            const newsItem = document.createElement("div");
            newsItem.className = "flex items-center flex-shrink-0 group";

            const link = document.createElement("a");
            link.className = "mx-4 text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors duration-300";
            link.href = article.link;
            link.target = "_blank";
            link.textContent = article.title;

            const button = document.createElement("button");
            button.className = "opacity-0 group-hover:opacity-100 text-[var(--icon-color)] hover:text-[var(--primary-glow)] transition-opacity duration-300";
            button.innerHTML = '<i class="material-icons text-lg">bookmark_border</i>';

            const dot = document.createElement("span");
            dot.className = "text-[var(--icon-color)] mx-4";
            dot.textContent = "•";

            newsItem.appendChild(link);
            newsItem.appendChild(button);
            newsItem.appendChild(dot);

            return newsItem;
        }

        function fetchNews(category, containerId, keyword = '') {
            const url = `https://newsdata.io/api/1/latest?apikey=${apiKey}&category=${category}&country=in,us,gb&language=en,ta${keyword ? `&q=${encodeURIComponent(keyword)}` : ''}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById(containerId);
                    if (!container) return console.error(`Container "${containerId}" not found`);

                    container.innerHTML = ''; // Clear previous content

                    const articles = data.results || [];
                    articles.forEach(article => {
                        container.appendChild(createNewsItem(article));
                    });
                })
                .catch(error => {
                    console.error(`Failed to fetch ${category} news:`, error);
                });
        }
        function allNews(){
            fetchNews('all', 'all-news-ticker');
        }
        // Individual category functions
        function tech() {
            fetchNews('technology', 'tech-news-ticker');
        }

        function business() {
            fetchNews('business', 'business-news-ticker');
        }

        function sports() {
            fetchNews('sports', 'sports-news-ticker');
        }

        function Javarelated() {
