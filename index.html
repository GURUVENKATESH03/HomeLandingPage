            <span class="status-divider">|</span>
            <span>guru@dashboard: ~/home</span>
        </div>
        <div class="status-right">
            <span id="current-section" class="status-muted">section: feed</span>
            <span class="status-divider">|</span>

    <!-- News Feed Pane (Footer) -->
    <footer id="news-footer" class="pane news-footer">
        <div class="pane-label">~/feed.log</div>
        <div class="news-tabs-container">
            <div class="news-tabs" data-tabs-container="">
                <button class="tab-btn active" data-tab-target="#java-news">Java</button>
                <button class="tab-btn" data-tab-target="#tech-news">Tech</button>
                <button class="tab-btn" data-tab-target="#business-news">Business</button>
                <button class="tab-btn" data-tab-target="#sports-news">Sports</button>
                <button class="tab-btn saved-tab" data-tab-target="#saved-news">
                    <i class="material-icons text-sm">bookmark_border</i> Saved
                </button>
                <div class="ml-auto">
                    <button onclick="getNews()" class="fetch-btn">./fetch_news.sh</button>
                </div>
            </div>
            <div class="news-content-wrapper">
                <div class="tab-content active" data-tab-content="" id="java-news">
                    <div class="news-ticker-wrapper">
                        <div class="news-ticker" id="java-news-ticker"></div>
                    </div>
                </div>
                <div class="tab-content" data-tab-content="" id="tech-news">
                    <div class="news-ticker-wrapper">
                        <div class="news-ticker" id="tech-news-ticker"></div>
                    </div>
                </div>
                <div class="tab-content" data-tab-content="" id="business-news">
                    <div class="news-ticker-wrapper">
                        <div class="news-ticker" id="business-news-ticker"></div>
                    </div>
                </div>
                <div class="tab-content" data-tab-content="" id="sports-news">
                    <div class="news-ticker-wrapper">
                        <div class="news-ticker" id="sports-news-ticker"></div>
                    </div>
                </div>
                <div class="tab-content saved-list" data-tab-content="" id="saved-news">
                    <div class="p-4 space-y-2">
                        <div class="saved-item">No saved articles yet.</div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>

</html>
