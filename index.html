 <!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guru's Portfolio</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
        :root {
            --primary-glow: #3d98f4;
            --background-start: #101a23;
            --background-end: #0c1218;
            --text-primary: #ffffff;
            --text-secondary: #90adcb;
            --input-bg: #1a2632;
            --icon-color: #90adcb;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }
        .glowing-border {
            box-shadow: 0 0 5px var(--primary-glow), 0 0 10px var(--primary-glow), 0 0 15px var(--primary-glow);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 5px var(--primary-glow), 0 0 10px var(--primary-glow), 0 0 15px var(--primary-glow); }
            50% { box-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow), 0 0 30px var(--primary-glow); }
            100% { box-shadow: 0 0 5px var(--primary-glow), 0 0 10px var(--primary-glow), 0 0 15px var(--primary-glow); }
        }
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            perspective: 1000px;
        }
        .particle {
            position: absolute;
            background-color: var(--primary-glow);
            border-radius: 50%;
            opacity: 0;
            animation: float-depth 20s infinite linear;
        }
        @keyframes float-depth {
            0% {
                transform: translateZ(0) translateY(0);
                opacity: 0.7;
            }
            100% {
                transform: translateZ(-1000px) translateY(-100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[var(--background-start)] to-[var(--background-end)] text-[var(--text-primary)]">
<div class="particle-container">
<div class="particle" style="width: 2px; height: 2px; left: 15%; animation-delay: -2s; animation-duration: 18s;"></div>
<div class="particle" style="width: 3px; height: 3px; left: 30%; animation-delay: -5s; animation-duration: 15s;"></div>
<div class="particle" style="width: 1px; height: 1px; left: 45%; animation-delay: -10s; animation-duration: 25s;"></div>
<div class="particle" style="width: 2px; height: 2px; left: 60%; animation-delay: -15s; animation-duration: 22s;"></div>
<div class="particle" style="width: 4px; height: 4px; left: 75%; animation-delay: 0s; animation-duration: 12s;"></div>
<div class="particle" style="width: 2px; height: 2px; left: 90%; animation-delay: -8s; animation-duration: 20s;"></div>
<div class="particle" style="width: 1px; height: 1px; left: 5%; animation-delay: -18s; animation-duration: 28s;"></div>
<div class="particle" style="width: 3px; height: 3px; left: 85%; animation-delay: -3s; animation-duration: 14s;"></div>
</div>

</svg>
</div>
<input autocomplete="off" class="w-full h-14 pl-12 pr-4 bg-[var(--input-bg)] text-lg text-[var(--text-primary)] placeholder-gray-500 border-2 border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-glow)] focus:border-[var(--primary-glow)] transition-all duration-300 glowing-border" name="q" placeholder="Search Google..." type="text"/>

<script>
      // A simple script to set the greeting based on the time of day.
      const greetingElement = document.getElementById('greeting');
      const hour = new Date().getHours();
      if (hour < 12) {
        greetingElement.textContent = 'Good Morning, Guru';
      } else if (hour < 18) {
        greetingElement.textContent = 'Good Afternoon, Guru';
      } else {
        greetingElement.textContent = 'Good Evening, Guru';
      }
